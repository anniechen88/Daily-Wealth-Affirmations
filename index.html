<html lang="zh-TW">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Wool Felt Background Pattern */
    body {
      background-color: #f5ede1;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 65%),
        radial-gradient(circle at 15% 25%, rgba(190, 168, 138, 0.15) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(190, 168, 138, 0.15) 0%, transparent 35%),
        repeating-linear-gradient(45deg, rgba(160, 135, 110, 0.035) 0px, rgba(160, 135, 110, 0.035) 2px, transparent 2px, transparent 5px),
        repeating-linear-gradient(-45deg, rgba(160, 135, 110, 0.03) 0px, rgba(160, 135, 110, 0.03) 2px, transparent 2px, transparent 5px);
      position: relative;
      overflow-x: hidden;
    }

    /* Falling Gold Dust & Coins Canvas Layer */
    #goldCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Wool Felted Pillowy Cards with Soft Needlework Stitches */
    .felt-card {
      background-color: #fcf9f4;
      border: 2.5px dashed #caa885;
      border-radius: 1.5rem;
      box-shadow: 
        0 10px 24px -5px rgba(110, 85, 60, 0.09),
        0 3px 8px rgba(110, 85, 60, 0.05),
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        inset 0 -3px 5px rgba(180, 155, 130, 0.18);
      transition: all 0.25s ease;
      position: relative;
      z-index: 2;
    }

    .felt-card:hover {
      border-color: #d19736;
      transform: translateY(-2px);
      box-shadow: 
        0 14px 28px -6px rgba(130, 95, 45, 0.18),
        inset 0 1px 3px rgba(255, 255, 255, 1);
    }

    .felt-card.reading-active {
      border-color: #c98e2b;
      background-color: #fffefb;
      box-shadow: 
        0 0 0 4px rgba(228, 178, 80, 0.45),
        0 16px 32px -4px rgba(166, 114, 40, 0.28),
        inset 0 2px 4px rgba(255, 255, 255, 0.95);
      transform: translateY(-3px);
    }

    /* Felt Patch Badge with Stitched Borders */
    .felt-badge {
      background: #ede3d3;
      border: 1.5px dashed #b89d7d;
      border-radius: 9999px;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.85), 0 2px 5px rgba(90,70,50,0.08);
    }

    /* Metallic Reflective Gold Button Styling */
    .btn-gold-metallic {
      position: relative;
      background: linear-gradient(135deg, 
        #c68b2c 0%, 
        #ffe28a 22%, 
        #e5a943 45%, 
        #fff8db 65%, 
        #b87417 85%, 
        #fde59b 100%
      );
      color: #3f2300;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      border: 1px solid #b87c1c;
      border-top: 1.5px solid #fff5be;
      border-bottom: 2px solid #854f0a;
      border-radius: 0.85rem;
      box-shadow: 
        0 5px 12px rgba(143, 90, 17, 0.38),
        0 2px 4px rgba(0, 0, 0, 0.12),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -2px 3px rgba(115, 68, 5, 0.35);
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* Metallic Shimmer Reflection Bar */
    .btn-gold-metallic::before {
      content: '';
      position: absolute;
      top: -60%;
      left: -70%;
      width: 50%;
      height: 220%;
      background: linear-gradient(
        90deg, 
        transparent, 
        rgba(255, 255, 255, 0.65), 
        transparent
      );
      transform: rotate(30deg);
      pointer-events: none;
      transition: all 0.65s ease;
    }

    .btn-gold-metallic:hover::before {
      left: 130%;
    }

    .btn-gold-metallic:hover {
      filter: brightness(1.08);
      transform: translateY(-1.5px);
      box-shadow: 
        0 8px 18px rgba(143, 90, 17, 0.48),
        inset 0 1px 2px rgba(255, 255, 255, 1),
        inset 0 -2px 4px rgba(115, 68, 5, 0.4);
    }

    .btn-gold-metallic:active {
      transform: translateY(1px);
      box-shadow: 
        0 2px 4px rgba(143, 90, 17, 0.4),
        inset 0 2px 4px rgba(115, 68, 5, 0.45);
    }

    /* Metallic Gold for Small Step Buttons (+ / -) */
    .btn-gold-step {
      background: linear-gradient(145deg, #ffe28f 0%, #d89832 50%, #fff4c2 100%);
      border: 1px solid #9e6712;
      border-top: 1.5px solid #fff9d1;
      border-bottom: 2px solid #734505;
      box-shadow: 
        0 3px 6px rgba(120, 75, 10, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px rgba(100, 60, 5, 0.3);
      color: #3d1f00;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      transition: all 0.15s ease;
    }
    .btn-gold-step:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(120, 75, 10, 0.45);
    }
    .btn-gold-step:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(90, 50, 0, 0.5);
    }

    /* Metallic Subtle Secondary Buttons */
    .btn-metallic-subtle {
      background: linear-gradient(135deg, #f5ebd9 0%, #fffbf2 50%, #e6d3ba 100%);
      border: 1px solid #cbb190;
      border-top: 1px solid #ffffff;
      color: #634726;
      box-shadow: 
        0 3px 6px rgba(100, 80, 60, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(140, 115, 85, 0.18);
    }
    .btn-metallic-subtle:hover {
      background: linear-gradient(135deg, #fff3dc 0%, #ffffff 50%, #edd8bd 100%);
      color: #462e13;
      border-color: #b59265;
    }
  </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-200">
  <!-- Ambient Falling Gold Dust & Gold Coins Canvas -->
  <canvas id="goldCanvas"></canvas>

  <!-- Top Header with Felt-Wool Banner Style -->

      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-500 to-amber-300 flex items-center justify-center text-white shadow-md shadow-amber-900/20 border border-amber-200/50">
          <i class="fa-solid fa-sparkles text-lg drop-shadow"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-amber-950 font-serif">Daily Wealth Affirmations</h1>
          <p class="text-xs text-amber-800/80 font-medium">每日 10 句富足英語 · 音標伴讀 · 羊毛氈美學朗讀器</p>
        </div>
      </div>

      <!-- Quick Group Indicator -->
      <div class="flex items-center gap-2 text-xs sm:text-sm felt-badge text-stone-700 px-3.5 py-1.5 font-medium">
        <i class="fa-solid fa-layer-group text-amber-700"></i>
        <span>組別：<span id="currentGroupLabel" class="font-bold text-amber-900">第 1 / 15 組</span></span>
        <span class="text-stone-400">|</span>
        <span id="totalSentenceCounter" class="text-stone-600">共 150 句</span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-4 py-6 sm:px-6 flex-1 w-full space-y-6">

    <!-- Control Center Card in Wool Felt & Metallic Gold -->
    <section class="felt-card p-4 sm:p-6 space-y-4">
      <div class="flex flex-col xl:flex-row items-start xl:items-center justify-between gap-3">
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-stone-800 flex items-center gap-2 flex-wrap">
            <span>今日朗讀研習</span>
            <span id="readingBadge" class="hidden text-xs felt-badge text-emerald-800 px-2.5 py-0.5 font-medium items-center gap-1 border-emerald-300 bg-emerald-50">

        </div>

        <!-- Main Interaction Buttons with Metallic Gold Finish (Fixed on the same line) -->
        <div class="flex items-center gap-2 sm:gap-2.5 flex-nowrap shrink-0 overflow-x-auto max-w-full pb-1 xl:pb-0">
          <!-- Switch 10 Sentences Button -->
          <button id="btnNextBatch" class="btn-gold-metallic shrink-0 inline-flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm whitespace-nowrap active:scale-95">

          <div class="flex items-center gap-2 bg-[#f4ebe0] px-3 py-1.5 rounded-xl border border-[#ddcbba] shadow-inner">

            <!-- Speed Down Button (-) 0.1x step -->
            <button id="btnSpeedDown" type="button" title="減慢語速 (-0.1x)" class="btn-gold-step w-7 h-7 rounded-lg font-bold flex items-center justify-center text-sm transition active:scale-90">
              <i class="fa-solid fa-minus"></i>
            </button>

            <!-- Speed Value Display Badge -->
            <span id="speedDisplay" class="font-mono font-bold text-amber-950 bg-white/90 border border-amber-300 px-2 py-0.5 rounded-md min-w-[54px] text-center shadow-sm">
              0.9x
            </span>

            <!-- Speed Up Button (+) 0.1x step -->
            <button id="btnSpeedUp" type="button" title="加快語速 (+0.1x)" class="btn-gold-step w-7 h-7 rounded-lg font-bold flex items-center justify-center text-sm transition active:scale-90">
              <i class="fa-solid fa-plus"></i>
            </button>

          <!-- Pronunciation Dialect -->

              <option value="compat_us">🇺🇸 美式相容預設 (en-US)</option>
              <option value="compat_gb">🇬🇧 英式相容預設 (en-GB)</option>
            </select>
          </div>

          <!-- Reading Tone Style Selector (口吻發音) -->
          <div class="flex items-center gap-2 bg-[#f4ebe0] px-3 py-1.5 rounded-xl border border-[#ddcbba]">
            <label for="toneSelect" class="font-bold text-stone-600"><i class="fa-solid fa-wand-magic-sparkles text-amber-700 mr-1"></i>口吻風格:</label>
            <select id="toneSelect" class="bg-white/90 border border-stone-300 rounded-lg px-2 py-0.5 text-stone-700 font-semibold focus:outline-none focus:ring-1 focus:ring-amber-500 text-xs shadow-sm">
              <option value="gentle">🌿 溫和緩慢 (冥想放鬆)</option>

            <!-- Populated dynamically via JS -->
          </select>
        </div>
      </div>
    </section>

    <!-- Sentence List Container -->

    <!-- Bottom Navigation / Group Switchers -->

        下一組 10 句 <i class="fa-solid fa-chevron-right text-xs"></i>

  </main>

      gentle: {
        name: '溫和緩慢',
        pitch: 0.88,
        rateMultiplier: 0.88
      },
      professional: {
        name: '專業沉穩',
        pitch: 1.0,
        rateMultiplier: 1.0
      },
      uplifting: {
        name: '陽光振奮',
        pitch: 1.18,
        rateMultiplier: 1.08
      }
    };

    // DOM Elements
    const sentenceListContainer = document.getElementById('sentenceListContainer');
    const btnNextBatch = document.getElementById('btnNextBatch');
    const btnNextBatchBottom = document.getElementById('btnNextBatchBottom');
    const btnPrevBatch = document.getElementById('btnPrevBatch');
    const btnToggleChinese = document.getElementById('btnToggleChinese');
    const lblToggleChinese = document.getElementById('lblToggleChinese');
    const btnPlayAll = document.getElementById('btnPlayAll');
    const iconPlayAll = document.getElementById('iconPlayAll');
    const textPlayAll = document.getElementById('textPlayAll');
    const currentGroupLabel = document.getElementById('currentGroupLabel');
    const groupSelect = document.getElementById('groupSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const readingBadge = document.getElementById('readingBadge');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const btnSpeedDown = document.getElementById('btnSpeedDown');
    const btnSpeedUp = document.getElementById('btnSpeedUp');
    const speedDisplay = document.getElementById('speedDisplay');
    const toneSelect = document.getElementById('toneSelect');

    /* Update speed display & bound check (0.1x step) */
    function updateSpeed(newRate) {
      // Clamped between 0.5x and 2.0x, rounded to 1 decimal place
      currentPlaybackRate = Math.min(Math.max(parseFloat(newRate.toFixed(1)), 0.5), 2.0);
      speedDisplay.textContent = currentPlaybackRate.toFixed(1) + 'x';
      showToast(`語速微調為 ${currentPlaybackRate.toFixed(1)}x`);
    }

    btnSpeedDown.addEventListener('click', () => {
      updateSpeed(currentPlaybackRate - 0.1);
    });

    btnSpeedUp.addEventListener('click', () => {
      updateSpeed(currentPlaybackRate + 0.1);
    });

    /* Tone Selection Change Listener */
    toneSelect.addEventListener('change', (e) => {
      currentTone = e.target.value;
      const profile = toneProfiles[currentTone] || toneProfiles.professional;
      showToast(`已切換口吻：${profile.name}`);
    });

    /* Show Toast Notification helper */
    function showToast(text) {
      toastMsg.textContent = text;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2200);
    }
    function renderCurrentBatch() {
      // Stop ongoing speech when batch switches
      stopReading();

      const startIdx = currentGroupIndex * BATCH_SIZE;
      const endIdx = Math.min(startIdx + BATCH_SIZE, totalSentences);
      const currentBatch = affirmationsDatabase.slice(startIdx, endIdx);

      // Update indicators
      currentGroupLabel.textContent = `第 ${currentGroupIndex + 1} / ${totalGroups} 組`;
      groupSelect.value = currentGroupIndex;

      // Render Sentence Cards with Wool Felt & Metallic Details
      sentenceListContainer.innerHTML = '';

      currentBatch.forEach((item, index) => {
        const globalNumber = startIdx + index + 1;
        const card = document.createElement('div');
        card.id = `card-${index}`;
        card.className = "felt-card p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4";

        card.innerHTML = `
          <div class="flex items-start gap-3 sm:gap-4 flex-1">
            <!-- Wool Felt Stitched Patch Number Badge -->
            <div class="w-8 h-8 rounded-full bg-[#eee5d6] text-amber-900 border border-dashed border-[#b8a287] shadow-sm flex-shrink-0 flex items-center justify-center font-bold text-xs mt-0.5">
              ${globalNumber}
            </div>

            <!-- Content Area: Sentence, IPA, Chinese -->
            <div class="space-y-1.5 flex-1">
              <!-- English Sentence -->
              <p class="text-base sm:text-lg font-semibold text-stone-800 tracking-wide font-sans leading-relaxed">
                ${item.en}
              </p>

              <!-- Phonetic Symbols (IPA) with Felt Label look -->
              <div class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-mono text-amber-900 bg-[#f3ecdf] border border-dashed border-[#d8c5af] px-3 py-1 rounded-lg">
                <i class="fa-solid fa-volume-low text-[10px] text-amber-600"></i>
                <span class="tracking-wider">${item.ipa}</span>
              </div>

              <!-- Chinese Translation (Hidden or Shown based on toggle or individual click) -->
              <div id="zh-${index}" class="chinese-content pt-1.5 text-sm text-stone-700 font-medium ${showChineseTranslation ? 'block' : 'hidden'}">
                <span class="text-amber-800 font-bold mr-1.5"><i class="fa-solid fa-seedling text-xs"></i> 涵義:</span>${item.zh}
              </div>
            </div>
          </div>

          <!-- Individual Action Toolbar with Metallic Sheen -->
          <div class="flex items-center justify-end gap-2.5 pt-2 md:pt-0 border-t md:border-t-0 border-[#eedecb] flex-shrink-0">
            <!-- Individual Speak Button (Metallic Gold) -->
            <button onclick="speakSingle(${index})" title="單句朗讀" class="btn-gold-metallic w-10 h-10 flex items-center justify-center text-sm active:scale-95">
              <i id="speaker-icon-${index}" class="fa-solid fa-volume-high"></i>
            </button>

            <!-- Individual Chinese Toggle Button -->
            <button onclick="toggleSingleChinese(${index})" title="查看此句翻譯" class="btn-metallic-subtle px-3.5 h-10 rounded-xl text-xs font-bold flex items-center gap-1.5 active:scale-95">
              <i class="fa-solid fa-language text-sm text-amber-700"></i>
              <span>中譯</span>
            </button>
          </div>
        `;
        sentenceListContainer.appendChild(card);
      });

      // Update Prev / Next button states
      btnPrevBatch.disabled = currentGroupIndex === 0;
      btnPrevBatch.classList.toggle('opacity-50', currentGroupIndex === 0);
      btnPrevBatch.classList.toggle('cursor-not-allowed', currentGroupIndex === 0);
    }

    function speakSentenceText(text, onEndCallback) {
      if (!('speechSynthesis' in window)) {
        showToast('您的瀏覽器不支援語音朗讀');
        if (onEndCallback) onEndCallback();
        return;
      }

      speechSynth.cancel(); // Clear previous speech queue

      const utterance = new SpeechSynthesisUtterance(text);
      
      // Apply selected Tone Profile (Pitch & Rate Multiplier)
      const tone = toneProfiles[currentTone] || toneProfiles.professional;
      const effectiveRate = Math.min(Math.max(currentPlaybackRate * tone.rateMultiplier, 0.5), 2.0);
      utterance.rate = parseFloat(effectiveRate.toFixed(2));
      utterance.pitch = tone.pitch;

      const selectedVoiceVal = voiceSelect.value;

      // Compatibility Modes:
      if (selectedVoiceVal === 'compat_default' || !selectedVoiceVal) {
        // High compatibility pure system default: let browser pick the best native English voice
        utterance.lang = 'en-US';
        utterance.voice = null;
      } else if (selectedVoiceVal === 'compat_us') {
        utterance.lang = 'en-US';
        const usVoice = availableVoices.find(v => v.lang === 'en-US' || v.lang === 'en_US');
        if (usVoice) utterance.voice = usVoice;
      } else if (selectedVoiceVal === 'compat_gb') {
        utterance.lang = 'en-GB';
        const gbVoice = availableVoices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
        if (gbVoice) utterance.voice = gbVoice;
      } else if (selectedVoiceVal.startsWith('voice_')) {
        const vIdx = parseInt(selectedVoiceVal.replace('voice_', ''), 10);
        if (availableVoices[vIdx]) {
          utterance.voice = availableVoices[vIdx];
          utterance.lang = availableVoices[vIdx].lang;
        } else {
          utterance.lang = 'en-US';
        }
      }

      let hasFinished = false;
      const finishExecution = () => {
        if (!hasFinished) {
          hasFinished = true;
          if (onEndCallback) onEndCallback();
        }
      };

      utterance.onend = finishExecution;

      // Error handler with automatic compatibility retry
      utterance.onerror = (e) => {
        console.warn('SpeechSynthesis error:', e);
        // If a specific voice failed (common on mobile WebKit/Android), retry once with pure system default
        if (utterance.voice) {
          const fallbackUtterance = new SpeechSynthesisUtterance(text);
          fallbackUtterance.lang = 'en-US';
          fallbackUtterance.rate = utterance.rate;
          fallbackUtterance.pitch = utterance.pitch;
          fallbackUtterance.onend = finishExecution;
          fallbackUtterance.onerror = () => finishExecution();
          speechSynth.speak(fallbackUtterance);
        } else {
          finishExecution();
        }
      };

      speechSynth.speak(utterance);
    }

    /* Highlight reading card */
    function highlightCard(indexInBatch) {
      clearHighlight();
      currentReadingIndexInBatch = indexInBatch;
      const card = document.getElementById(`card-${indexInBatch}`);
      if (card) {
        card.classList.add('reading-active');
        const icon = document.getElementById(`speaker-icon-${indexInBatch}`);
        if (icon) {
          icon.className = "fa-solid fa-waveform-lines animate-bounce text-amber-700";
        }
      }
      readingBadge.classList.remove('hidden');
      readingBadge.classList.add('inline-flex');
    }

    /* Clear all active reading card highlights */
    function clearHighlight() {
      const cards = document.querySelectorAll('.felt-card');
      cards.forEach(card => card.classList.remove('reading-active'));
      const icons = document.querySelectorAll('[id^="speaker-icon-"]');
      icons.forEach(ic => {
        ic.className = "fa-solid fa-volume-high";
      });
      readingBadge.classList.add('hidden');
      readingBadge.classList.remove('inline-flex');
      currentReadingIndexInBatch = -1;
    }

    /* Stop speech engine and reading loops */
    function stopReading() {
      if (speechSynth) speechSynth.cancel();
      isPlayingAll = false;
      updatePlayAllButtonUI();
      clearHighlight();
    }

    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = speechSynth.getVoices();
      availableVoices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      if (availableVoices.length === 0) availableVoices = allVoices;

      const currentValue = voiceSelect.value;
      voiceSelect.innerHTML = '';

      // 1. High compatibility preset group
      const compatGroup = document.createElement('optgroup');
      compatGroup.label = "相容通用模式 (推薦/相容性最佳)";

      const optCompatDefault = document.createElement('option');
      optCompatDefault.value = 'compat_default';
      optCompatDefault.textContent = '🌐 系統最高相容 (標準發音)';

      const optCompatUS = document.createElement('option');
      optCompatUS.value = 'compat_us';
      optCompatUS.textContent = '🇺🇸 美式相容預設 (en-US)';

      const optCompatGB = document.createElement('option');
      optCompatGB.value = 'compat_gb';
      optCompatGB.textContent = '🇬🇧 英式相容預設 (en-GB)';

      compatGroup.appendChild(optCompatDefault);
      compatGroup.appendChild(optCompatUS);
      compatGroup.appendChild(optCompatGB);
      voiceSelect.appendChild(compatGroup);

      // 2. Hardware / Browser Installed Voice List
      if (availableVoices.length > 0) {
        const hardwareGroup = document.createElement('optgroup');
        hardwareGroup.label = "系統內建音色清單 (可指定)";

        availableVoices.forEach((voice, index) => {
          const option = document.createElement('option');
          option.value = `voice_${index}`;
          // Clean display name
          const flag = voice.lang.includes('GB') ? '🇬🇧 ' : voice.lang.includes('US') ? '🇺🇸 ' : '🗣️ ';
          option.textContent = `${flag}${voice.name} (${voice.lang})`;
          hardwareGroup.appendChild(option);
        });

        voiceSelect.appendChild(hardwareGroup);
      }

      // Restore selection or default to universal compatible mode
      if (currentValue && voiceSelect.querySelector(`option[value="${currentValue}"]`)) {
        voiceSelect.value = currentValue;
      } else {
        voiceSelect.value = 'compat_default';
      }
    }

    /* Initialize group jumping dropdown */
    function initGroupSelect() {
      groupSelect.innerHTML = '';
      for (let i = 0; i < totalGroups; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `第 ${i + 1} 組 (${i * BATCH_SIZE + 1} ~ ${Math.min((i + 1) * BATCH_SIZE, totalSentences)})`;
        groupSelect.appendChild(option);
      }
    }

    /* Read single sentence */
    window.speakSingle = function(indexInBatch) {
      if (isPlayingAll) {
        stopReading();
      }

      const startIdx = currentGroupIndex * BATCH_SIZE;
      const item = affirmationsDatabase[startIdx + indexInBatch];
      if (!item) return;

      highlightCard(indexInBatch);
      speakSentenceText(item.en, () => {
        clearHighlight();
      });
    };

    /* Continuous play of the current 10 sentences */
    function playAllCurrentBatch() {
      if (isPlayingAll) {
        stopReading();
        showToast('已停止朗讀');
        return;
      }

      const startIdx = currentGroupIndex * BATCH_SIZE;
      const endIdx = Math.min(startIdx + BATCH_SIZE, totalSentences);
      const currentBatch = affirmationsDatabase.slice(startIdx, endIdx);

      if (currentBatch.length === 0) return;

      isPlayingAll = true;
      updatePlayAllButtonUI();
      showToast(`開始依序朗讀第 ${currentGroupIndex + 1} 組的 10 個句子`);

      let currentItemIndex = 0;

      function speakNextInQueue() {
        if (!isPlayingAll) return;

        if (currentItemIndex >= currentBatch.length) {
          // Finished reading the 10 sentences
          stopReading();
          showToast('當前 10 句朗讀完畢！');
          return;
        }

        highlightCard(currentItemIndex);
        const sentenceToRead = currentBatch[currentItemIndex].en;

        speakSentenceText(sentenceToRead, () => {
          currentItemIndex++;
          // Small pause between sentences for clarity
          setTimeout(() => {
            if (isPlayingAll) {
              speakNextInQueue();
            }
          }, 650);
        });
      }

      speakNextInQueue();
    }

    function updatePlayAllButtonUI() {
      if (isPlayingAll) {
        btnPlayAll.classList.replace('btn-gold-metallic', 'bg-rose-600');
        btnPlayAll.classList.add('text-white');
        iconPlayAll.className = "fa-solid fa-pause";
        textPlayAll.textContent = "停止朗讀";
      } else {
        btnPlayAll.classList.replace('bg-rose-600', 'btn-gold-metallic');
        btnPlayAll.classList.remove('text-white');
        iconPlayAll.className = "fa-solid fa-play";
        textPlayAll.textContent = "朗讀此 10 句";
      }
    }

    // Individual Chinese toggle
    window.toggleSingleChinese = function(indexInBatch) {
      const el = document.getElementById(`zh-${indexInBatch}`);
      if (el) {
        el.classList.toggle('hidden');

    // Global Chinese translation toggle button
    function toggleAllChinese() {

        lblToggleChinese.textContent = "隱藏中文翻譯";
      } else {

      showToast(showChineseTranslation ? '已顯示全部中文翻譯' : '已隱藏中文翻譯');

    // Switch to next batch of 10 sentences
    function goToNextBatch() {
      currentGroupIndex = (currentGroupIndex + 1) % totalGroups;
      renderCurrentBatch();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast(`已切換至第 ${currentGroupIndex + 1} 組 (共 10 句)`);

    // Switch to previous batch of 10 sentences
    function goToPrevBatch() {
      if (currentGroupIndex > 0) {
        currentGroupIndex--;
        renderCurrentBatch();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`已切換至第 ${currentGroupIndex + 1} 組 (共 10 句)`);

    btnPlayAll.addEventListener('click', playAllCurrentBatch);

    groupSelect.addEventListener('change', (e) => {
      currentGroupIndex = parseInt(e.target.value, 10);
      renderCurrentBatch();
      showToast(`已跳轉至第 ${currentGroupIndex + 1} 組`);
    });

    /* Falling Gold Dust & Abundant Shining Gold Coins Canvas Animation */
    function initGoldCanvas() {
      const canvas = document.getElementById('goldCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      // Rich abundance of spinning coins and sparkling gold dust
      const COIN_COUNT = 75;
      const DUST_COUNT = 55;

      // Initialize Coins
      for (let i = 0; i < COIN_COUNT; i++) {
        particles.push(createCoin(true));
      }
      // Initialize Sparkling Stardust
      for (let i = 0; i < DUST_COUNT; i++) {
        particles.push(createDust(true));
      }

      function createCoin(randomY = false) {
        const radius = Math.random() * 8 + 8; // Sizes from 8px to 16px radius
        return {
          type: 'coin',
          x: Math.random() * width,
          y: randomY ? Math.random() * height : -30 - Math.random() * 50,
          radius: radius,
          speedY: Math.random() * 1.5 + 1.1,
          speedX: (Math.random() - 0.5) * 0.9,
          // 3D rotation & wobble angles
          rotZ: Math.random() * Math.PI * 2,
          rotZSpeed: (Math.random() - 0.5) * 0.04,
          spinAngle: Math.random() * Math.PI * 2,
          spinSpeed: Math.random() * 0.065 + 0.035, // Rate of coin tumbling
          wobbleAngle: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.03 + 0.015,
          glintPhase: Math.random() * Math.PI * 2,
          glintSpeed: Math.random() * 0.08 + 0.05,
          opacity: Math.random() * 0.35 + 0.65
        };
      }

      function createDust(randomY = false) {
        return {
          type: 'dust',
          x: Math.random() * width,
          y: randomY ? Math.random() * height : -15,
          radius: Math.random() * 2.8 + 1.2,
          speedY: Math.random() * 0.75 + 0.35,
          speedX: (Math.random() - 0.5) * 0.6,
          pulse: Math.random() * Math.PI * 2,
          pulseSpeed: Math.random() * 0.07 + 0.03,
          sparkleRays: Math.random() < 0.35 // 35% chance to draw 4-point sparkle star
        };
      }

      function drawCoin(c) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotZ);

        // 3D vertical coin flipping compression
        const flip = Math.sin(c.spinAngle);
        const absFlip = Math.max(Math.abs(flip), 0.08); // Maintain minimal thickness edge
        ctx.scale(1, flip);

        // Ambient coin glow
        ctx.shadowColor = 'rgba(255, 215, 0, 0.65)';
        ctx.shadowBlur = 10 * absFlip;

        // Outer rim gradient
        const rimGrad = ctx.createLinearGradient(-c.radius, -c.radius, c.radius, c.radius);
        rimGrad.addColorStop(0, '#fff4b8');
        rimGrad.addColorStop(0.2, '#f5c042');
        rimGrad.addColorStop(0.5, '#e0981b');
        rimGrad.addColorStop(0.8, '#ffeaa5');
        rimGrad.addColorStop(1, '#9b5b03');

        ctx.beginPath();
        ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = rimGrad;
        ctx.globalAlpha = c.opacity;
        ctx.fill();

        // High-contrast inner rim
        ctx.beginPath();
        ctx.arc(0, 0, c.radius * 0.8, 0, Math.PI * 2);
        const innerGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, c.radius * 0.85);
        innerGrad.addColorStop(0, '#fff9d6');
        innerGrad.addColorStop(0.5, '#f4ba3b');
        innerGrad.addColorStop(1, '#c97e0d');
        ctx.fillStyle = innerGrad;
        ctx.fill();

        // Stitched/embossed concentric ring
        ctx.beginPath();
        ctx.arc(0, 0, c.radius * 0.72, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = Math.max(0.8, c.radius * 0.08);
        ctx.stroke();

        // Dollar sign ($) relief engraving
        if (absFlip > 0.35) {
          ctx.font = `bold ${Math.round(c.radius * 0.95)}px "Cinzel", "Times New Roman", serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(97, 54, 2, 0.85)';
          ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
          ctx.shadowBlur = 2;
          ctx.fillText('$', 0, 0.8);
        }

        // Shimmering specular reflection bar
        const glintVal = Math.sin(c.glintPhase);
        if (glintVal > 0.4 && absFlip > 0.25) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
          ctx.clip();
          
          const glintPos = (glintVal - 0.7) * 2.5 * c.radius;
          const glintGrad = ctx.createLinearGradient(glintPos - 5, -c.radius, glintPos + 5, c.radius);
          glintGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          glintGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.9)');
          glintGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          
          ctx.fillStyle = glintGrad;
          ctx.fillRect(-c.radius, -c.radius, c.radius * 2, c.radius * 2);
          ctx.restore();
        }

        ctx.restore();

        // Exterior star glint burst when reflection peaks
        if (glintVal > 0.88 && absFlip > 0.5) {
          drawGlintStar(c.x + Math.cos(c.rotZ) * c.radius * 0.6, c.y + Math.sin(c.rotZ) * c.radius * 0.6, (glintVal - 0.88) * 45);
        }
      }

      function drawGlintStar(x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffe375';
        ctx.shadowBlur = 8;
        
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.lineTo(size, 0);
          ctx.lineTo(size * 0.2, size * 0.2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawDust(d) {
        ctx.save();
        ctx.translate(d.x, d.y);
        
        const alpha = (Math.sin(d.pulse) + 1) * 0.45 + 0.15;
        ctx.globalAlpha = alpha;

        const radGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, d.radius * 2);
        radGrad.addColorStop(0, '#ffffff');
        radGrad.addColorStop(0.35, '#ffdf79');
        radGrad.addColorStop(0.8, '#f5a623');
        radGrad.addColorStop(1, 'rgba(245, 166, 35, 0)');

        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(0, 0, d.radius * 2, 0, Math.PI * 2);
        ctx.fill();

        if (d.sparkleRays && alpha > 0.6) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(-d.radius * 3, 0);
          ctx.lineTo(d.radius * 3, 0);
          ctx.moveTo(0, -d.radius * 3);
          ctx.lineTo(0, d.radius * 3);
          ctx.stroke();
        }

        ctx.restore();
      }

      function updateAndAnimate() {
        ctx.clearRect(0, 0, width, height);

        particles.forEach((p, idx) => {
          if (p.type === 'coin') {
            p.y += p.speedY;
            p.x += Math.sin(p.wobbleAngle) * 0.75 + p.speedX;
            p.wobbleAngle += p.wobbleSpeed;
            p.spinAngle += p.spinSpeed;
            p.rotZ += p.rotZSpeed;
            p.glintPhase += p.glintSpeed;

            drawCoin(p);

            // Recycle coin back to top
            if (p.y > height + 35 || p.x < -35 || p.x > width + 35) {
              particles[idx] = createCoin(false);
            }
          } else {
            p.y += p.speedY;
            p.x += p.speedX;
            p.pulse += p.pulseSpeed;

            drawDust(p);

            // Recycle dust speck
            if (p.y > height + 15 || p.x < -15 || p.x > width + 15) {
              particles[idx] = createDust(false);
            }
          }
        });

        requestAnimationFrame(updateAndAnimate);
      }

      updateAndAnimate();
    }

    /* Initial bootstrap on page load */
    window.onload = function() {
      initGroupSelect();
      renderCurrentBatch();
      initGoldCanvas();

      if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
        // Safety retry for browsers (e.g., Safari/Chrome) where voices load asynchronously
        setTimeout(loadVoices, 350);
        setTimeout(loadVoices, 1000);
      }
    };
  </script>
</body>
</html>
